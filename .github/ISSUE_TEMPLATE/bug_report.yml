name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I click on... I expected... but instead...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error logs
      description: If applicable, add screenshots or paste console errors.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the application is affected?
      options:
        - Editor
        - Viewer
        - Dashboard
        - 3D Globe (Cesium)
        - Point Cloud (Potree)
        - Participatory Maps
        - Layers / Data
        - AI Assistant
        - Authentication / Users
        - Media Library
        - API
        - Installation / Docker
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 120 on Windows 11, Safari 17 on macOS
      placeholder: Chrome 120, Windows 11
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker (self-hosted)
        - Local development
        - Other
    validations:
      required: false

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkingMaps – Racconta storie sulla mappa</title>
    <meta name="description" content="Piattaforma open source per creare storymaps interattive, visualizzazioni dati e presentazioni geospaziali.">
    <link rel="icon" type="image/png" href="img/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet">

    <!-- MapLibre GL Draw (lines/polygons) -->
    <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet">

    <!-- Cesium -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- App CSS -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/viewer.css" rel="stylesheet">
    <link href="css/editor.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <!-- ═══ PUBLIC LANDING PAGE ═══ -->
    <div id="landing-page" class="d-none">
        <nav class="landing-nav">
            <a href="#" class="landing-nav-brand" onclick="return false">
                <img src="img/logo.png" alt="TM"> TalkingMaps
            </a>
            <div class="landing-nav-links">
                <a href="#features" id="landing-link-features"></a>
                <a href="#install" id="landing-link-install"></a>
                <a href="#" class="btn btn-sm btn-outline-light" id="landing-btn-login"></a>
            </div>
        </nav>

        <div class="landing-hero">
            <h1 id="landing-hero-title"></h1>
            <p id="landing-hero-subtitle"></p>
            <div class="landing-hero-actions">
                <button class="btn btn-gradient" id="landing-cta-start"></button>
                <a href="#install" class="btn btn-outline-light" id="landing-cta-docs"></a>
            </div>
        </div>

        <div class="landing-section" id="features">
            <h2 id="landing-feat-title"></h2>
            <p class="section-subtitle" id="landing-feat-subtitle"></p>
            <div class="features-grid" id="landing-features-grid"></div>
        </div>

        <div class="landing-section" id="install">
            <h2 id="landing-install-title"></h2>
            <p class="section-subtitle" id="landing-install-subtitle"></p>
            <div class="landing-install">
                <pre><code># Clone the repo
git clone https://github.com/fgianoli/talkingmaps.git
cd talkingmaps

# Copy and edit the environment file
cp .env.example .env

# Start everything with Docker
docker compose up -d

# Open http://localhost:8080 and you're in!</code></pre>
            </div>
        </div>

        <div class="landing-footer">
            <p id="landing-authors"></p>
            <p style="margin-top:8px">
                <a href="https://github.com/fgianoli/talkingmaps" target="_blank">
                    <i class="bi bi-github"></i> GitHub
                </a>
            </p>
        </div>
    </div>

    <!-- ═══ LOGIN SCREEN ═══ -->
    <div id="login-screen" class="d-none">
        <div class="login-container">
            <div class="login-logo">
                <img src="img/logo.png" alt="TalkingMaps" class="login-logo-img">
                <h1>TalkingMaps</h1>
                <p id="login-tagline"></p>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <input type="text" class="form-control" id="login-username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="login-submit-btn"></button>
                <div id="login-error" class="text-danger mt-2 d-none" style="font-size:13px"></div>
            </form>

            <!-- Google Sign-In -->
            <div class="google-signin-divider" id="google-divider">
                <span id="google-divider-text"></span>
            </div>
            <button class="btn-google" id="btn-google-login">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 2.58 9 3.58z" fill="#EA4335"/>
                </svg>
                <span id="google-btn-text"></span>
            </button>

            <div class="login-footer">
                <a href="#" id="btn-explore-public"><span id="explore-public-text"></span> <i class="bi bi-arrow-right"></i></a>
            </div>
        </div>
    </div>

    <!-- ═══ MAIN APP ═══ -->
    <div id="app" class="d-none">
        <nav class="navbar" id="main-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" id="btn-home">
                    <img src="img/logo.png" alt="TM" class="navbar-logo"> TalkingMaps
                </a>
                <div class="navbar-actions">
                    <button class="btn btn-sm btn-primary" id="btn-new-story">
                        <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline" id="nav-new-story-text"></span>
                    </button>

                    <!-- Language selector -->
                    <select class="form-select form-select-sm" id="btn-lang"
                        style="width:auto;padding:4px 28px 4px 8px;font-size:12px">
                        <option value="it">IT</option>
                        <option value="en">EN</option>
                        <option value="es">ES</option>
                    </select>

                    <div class="dropdown d-inline-block">
                        <button class="btn btn-sm btn-outline-light dropdown-toggle" data-bs-toggle="dropdown" id="user-menu-btn">
                            <i class="bi bi-person-circle"></i> <span id="current-user-name" class="d-none d-md-inline"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="btn-dashboard"><i class="bi bi-grid-1x2 me-2"></i><span class="nav-text-dashboard"></span></a></li>
                            <li><a class="dropdown-item" href="#" id="btn-layers-catalog"><i class="bi bi-layers me-2"></i><span class="nav-text-layers"></span></a></li>
                            <li><a class="dropdown-item" href="#" id="btn-media-library"><i class="bi bi-image me-2"></i><span class="nav-text-media"></span></a></li>
                            <li><a class="dropdown-item admin-only" href="#" id="btn-users-admin"><i class="bi bi-people me-2"></i><span class="nav-text-users"></span></a></li>
                            <li><a class="dropdown-item admin-only" href="#" id="btn-basemaps-admin"><i class="bi bi-map me-2"></i><span class="nav-text-basemaps"></span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="btn-logout"><i class="bi bi-box-arrow-right me-2"></i><span class="nav-text-logout"></span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div id="app-content">
            <div id="panel-dashboard" class="app-panel d-none"></div>
            <div id="panel-editor" class="app-panel d-none"></div>
            <div id="panel-layers" class="app-panel d-none"></div>
            <div id="panel-media" class="app-panel d-none"></div>
            <div id="panel-users" class="app-panel d-none"></div>
            <div id="panel-basemaps" class="app-panel d-none"></div>
        </div>
    </div>

    <!-- ═══ STORY VIEWER (full-screen) ═══ -->
    <div id="story-viewer" class="d-none">
        <div id="viewer-toolbar">
            <button class="btn btn-sm btn-light" id="viewer-close" title="Chiudi">
                <i class="bi bi-x-lg"></i>
            </button>
            <span id="viewer-title"></span>
            <div class="viewer-toolbar-right">
                <button class="btn btn-sm btn-light" id="viewer-toggle-3d" title="Vista 3D">
                    <i class="bi bi-badge-3d"></i>
                </button>
                <button class="btn btn-sm btn-light" id="viewer-basemap-btn" title="Basemap">
                    <i class="bi bi-map"></i>
                </button>
                <button class="btn btn-sm btn-light" id="viewer-share-btn" title="Share">
                    <i class="bi bi-share"></i>
                </button>
                <span id="viewer-progress">1 / 1</span>
            </div>
        </div>

        <div id="viewer-map-container">
            <div id="viewer-map"></div>
            <div id="viewer-cesium" class="d-none"></div>
        </div>

        <div id="viewer-narrative"></div>

        <div id="viewer-nav">
            <button class="btn btn-light" id="viewer-prev"><i class="bi bi-chevron-up"></i></button>
            <button class="btn btn-light" id="viewer-next"><i class="bi bi-chevron-down"></i></button>
        </div>

        <div id="viewer-basemap-selector" class="d-none"></div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>

    <!-- App modules (order matters: i18n first) -->
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
    <script src="js/cesium3d.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/media-library.js"></script>
    <script src="js/potree-viewer.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/chart-wizard.js"></script>

    <script>
        // Sync language selector on load
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('tm_lang') || 'it';
            const sel = document.getElementById('btn-lang');
            if (sel) sel.value = lang;
        });
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2120 1000" width="2120" height="1000" role="img" aria-label="Pianta schematica di uno scavo: disegno illustrativo">
  <defs>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#b9ad96" stroke-width="4"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#ded5c4" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="2120" height="1000" fill="#f3ede1"/>
  <rect width="2120" height="1000" fill="url(#grid)"/>

  <!-- perimetro -->
  <rect x="180" y="130" width="1760" height="740" fill="none" stroke="#5c5344" stroke-width="10"/>

  <!-- cortile centrale -->
  <rect x="820" y="330" width="480" height="360" fill="#e7dcc4" stroke="#5c5344" stroke-width="7"/>
  <circle cx="1060" cy="510" r="46" fill="#cfe0e8" stroke="#5c5344" stroke-width="6"/>
  <text x="1060" y="600" text-anchor="middle" font-family="Ubuntu, Arial, sans-serif" font-size="30" fill="#5c5344">cortile</text>

  <!-- ambienti a ovest -->
  <g stroke="#5c5344" stroke-width="7" fill="url(#hatch)">
    <rect x="220" y="180" width="270" height="220"/>
    <rect x="220" y="430" width="270" height="180"/>
    <rect x="220" y="640" width="270" height="190"/>
    <rect x="520" y="180" width="260" height="300"/>
    <rect x="520" y="510" width="260" height="320"/>
  </g>
  <!-- ambienti a est -->
  <g stroke="#5c5344" stroke-width="7" fill="url(#hatch)">
    <rect x="1340" y="180" width="290" height="250"/>
    <rect x="1340" y="460" width="290" height="180"/>
    <rect x="1340" y="670" width="290" height="160"/>
    <rect x="1660" y="180" width="240" height="330"/>
    <rect x="1660" y="540" width="240" height="290"/>
  </g>

  <!-- ingresso -->
  <rect x="1000" y="860" width="120" height="20" fill="#f3ede1" stroke="none"/>
  <path d="M1000 870 L1000 940 M1120 870 L1120 940" stroke="#5c5344" stroke-width="7" fill="none"/>
  <text x="1060" y="975" text-anchor="middle" font-family="Ubuntu, Arial, sans-serif" font-size="28" fill="#5c5344">ingresso</text>

  <!-- etichette ambienti -->
  <g font-family="Ubuntu, Arial, sans-serif" font-size="26" fill="#4a4238" text-anchor="middle">
    <text x="355" y="300">A1</text><text x="355" y="530">A2</text><text x="355" y="745">A3</text>
    <text x="650" y="340">B1</text><text x="650" y="680">B2</text>
    <text x="1485" y="315">C1</text><text x="1485" y="560">C2</text><text x="1485" y="760">C3</text>
    <text x="1780" y="355">D1</text><text x="1780" y="695">D2</text>
  </g>

  <!-- scala grafica -->
  <g transform="translate(180, 920)">
    <rect x="0" y="0" width="80" height="14" fill="#5c5344"/>
    <rect x="80" y="0" width="80" height="14" fill="#f3ede1" stroke="#5c5344" stroke-width="3"/>
    <rect x="160" y="0" width="80" height="14" fill="#5c5344"/>
    <text x="0" y="46" font-family="Ubuntu, Arial, sans-serif" font-size="24" fill="#5c5344">0</text>
    <text x="240" y="46" text-anchor="middle" font-family="Ubuntu, Arial, sans-serif" font-size="24" fill="#5c5344">15 m</text>
  </g>

  <!-- nord -->
  <g transform="translate(1960, 900)">
    <path d="M0 -46 L14 14 L0 2 L-14 14 Z" fill="#5c5344"/>
    <text x="0" y="46" text-anchor="middle" font-family="Ubuntu, Arial, sans-serif" font-size="26" fill="#5c5344">N</text>
  </g>

  <!-- intestazione -->
  <rect x="0" y="0" width="2120" height="70" fill="#5c5344"/>
  <text x="40" y="46" font-family="Ubuntu, Arial, sans-serif" font-size="30" fill="#f3ede1">Pianta di scavo — disegno schematico</text>
  <text x="2080" y="46" text-anchor="end" font-family="Ubuntu, Arial, sans-serif" font-size="22" fill="#cfc6b4">illustrazione, non un rilievo reale</text>
</svg>
